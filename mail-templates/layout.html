<!--
  Gemeinsames Layout fuer alle Mails. Der Platzhalter body (in doppelten geschweiften
  Klammern) wird durch den Inhalt der jeweiligen Vorlage ersetzt, der Platzhalter subject
  durch deren Betreff. Inline-Styles, da E-Mail-Clients externe/Style-Tags nicht
  zuverlaessig unterstuetzen. Pflegbar ohne Rebuild (per Compose-Volume gemountet).
-->
<div style="margin:0;padding:24px;background:#f4f5f7;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2430;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="background:#4b3fb0;padding:18px 24px;color:#ffffff;font-weight:600;font-size:15px;">
      Ausbildungsplan Informatik EFZ
    </div>
    <div style="padding:24px;font-size:14px;line-height:1.6;color:#1f2430;">
      {{body}}
    </div>
    <div style="padding:16px 24px;border-top:1px solid #eeeeee;font-size:12px;color:#8a90a2;">
      Automatische Nachricht des Ausbildungsplan-Tools · Swiss TPH.
      Bei Fragen wende dich an deinen Berufsbildner.
    </div>
  </div>
</div>
