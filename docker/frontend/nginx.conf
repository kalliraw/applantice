# =====================================================================
# Liefert die SPA und proxyt die Supabase-Endpunkte auf denselben Origin.
#   /auth/v1/...  -> GoTrue  (Prefix wird abgeschnitten)
#   /rest/v1/...  -> PostgREST (Prefix wird abgeschnitten)
# Dadurch ist VITE_SUPABASE_URL = die App-URL selbst (kein CORS nötig).
# =====================================================================
server {
    listen 80;
    server_name _;

    # Vom @supabase/supabase-js erwartete API-Pfade.
    resolver 127.0.0.11 valid=30s;

    # Der OAuth-Callback leitet mit access_token + refresh_token in der URL und
    # Set-Cookie zurück -> grosse Antwort-Header. Puffer über den Default (8k)
    # anheben, sonst 502 "upstream sent too big header".
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mail-Sender-Dienst: /mail/send -> mailer:8025/send. Body-Limit hoch wegen
    # PDF-Anhang (Bildungsbericht). Auth prüft der mailer selbst (Supabase-JWT).
    location /mail/ {
        proxy_pass http://mailer:8025/;
        proxy_http_version 1.1;
        client_max_body_size 30m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gehashte Build-Assets (Vite: /assets/index-<hash>.js …) sind unveränderlich
    # -> dauerhaft cachen. Der Dateiname ändert sich bei jedem Build.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Statische SPA mit History-API-Fallback (React Router).
    # WICHTIG: index.html NIE cachen – sonst lädt der Browser nach einem Rebuild
    # (oder nach dem OAuth-Redirect mit #…) weiter die alte Shell mit veralteten
    # Asset-Verweisen. no-store erzwingt bei jedem Aufruf die frische Shell, die
    # dann auf die aktuellen gehashten Assets zeigt.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
